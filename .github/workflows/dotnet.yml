# The .NET half of what this repository used to ask a human to run by hand. README section 12
# is the acceptance list; this workflow is the part of it that needs neither a cluster nor Helm.
name: dotnet

on:
  push:
    branches: [main]
    # release.yml commits the release file back to main. Pushes made with GITHUB_TOKEN do not
    # trigger workflows, so this is belt-and-braces -- but it is where somebody will look.
    paths-ignore: ['deploy/releases/**']
  pull_request:
  workflow_dispatch:
  # Called by release.yml, where a green run is a precondition of cutting a release.
  workflow_call:

concurrency:
  # github.workflow is the *caller's* workflow name inside a reusable workflow. A run started
  # from release.yml therefore lands in its own group instead of queueing behind a push run
  # that happens to be on main at the same moment.
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins 10.0.302 with rollForward: latestPatch.
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Restores all four projects with --locked-mode and fails if any packages.lock.json was
      # rewritten behind its back.
      - name: check-repro.sh
        run: ./scripts/check-repro.sh

      # ContinuousIntegrationBuild is what switches RestoreLockedMode on in Directory.Build.props.
      # GitHub Actions does not set it, so passing it here is the whole point of this step.
      # No --no-restore: the restore is the thing being verified.
      - name: Test in locked mode
        run: dotnet test -p:ContinuousIntegrationBuild=true

      # check-repro.sh hashes the lock files itself, but a rewrite by `dotnet test` would land
      # after it ran. This is the cheap second look.
      - name: Lock files unchanged
        run: git diff --exit-code -- '*packages.lock.json'
