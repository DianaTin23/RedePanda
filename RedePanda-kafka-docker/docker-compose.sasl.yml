name: redpanda-chat-sasl

services:
  redpanda:
    image: docker.io/redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d
    container_name: redpanda-sasl-0

    environment:
      RP_BOOTSTRAP_USER: "chat:chat-secret-pw:SCRAM-SHA-512"

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk redpanda config set redpanda.enable_sasl true
        rpk redpanda config set redpanda.superusers '["chat"]'
        rpk redpanda config set redpanda.kafka_api_tls \
          '[{"name":"external","enabled":true,"cert_file":"/etc/redpanda/tls/broker.crt","key_file":"/etc/redpanda/tls/broker.key","require_client_auth":false}]'
        exec rpk redpanda start \
          --mode=dev-container \
          --smp=1 \
          --default-log-level=info \
          --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19093 \
          --advertise-kafka-addr=internal://redpanda-sasl-0:9092,external://${ADVERTISED_HOST:-127.0.0.1}:19093 \
          --rpc-addr=redpanda-sasl-0:33145 \
          --advertise-rpc-addr=redpanda-sasl-0:33145

    ports:
      - "19093:19093"   # Kafka extern, SASL_SSL
      - "9645:9644"     # Admin API (anderer Host-Port als der Plaintext-Broker)

    volumes:
      - ./tls:/etc/redpanda/tls:ro
      - redpanda-sasl-data:/var/lib/redpanda/data

volumes:
  redpanda-sasl-data:
