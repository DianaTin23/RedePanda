name: redpanda-chat

services:
  redpanda:
    # KEEP IN SYNC: redpanda.image in values.yaml (scripts/check-digests.sh checks the parity).
    image: docker.io/redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d
    container_name: redpanda-0

    environment:
      RP_BOOTSTRAP_USER: "chat:chat-secret-pw:SCRAM-SHA-512"

    # One broker, two external listeners: 19092 plaintext, 19093 TLS + SASL/SCRAM. 19093 only
    # appears once tls/ holds key material (`./make-tls.sh`).
    #
    # Listeners are set through redpanda.kafka_api, not --kafka-addr: that flag rebuilds the
    # list at startup and drops authentication_method, which would enable SASL everywhere.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e

        rpk redpanda config set redpanda.enable_sasl true
        rpk redpanda config set redpanda.superusers '["chat"]'
        # enable_sasl would otherwise switch on ACL checks too, so the unauthenticated 19092
        # listener could no longer create topics. Auth on 19093 is unaffected.
        rpk redpanda config set redpanda.kafka_enable_authorization false

        if [ -f /etc/redpanda/tls/broker.crt ]; then
            echo "==> tls/ found: SASL_SSL listener on 19093 active"
            rpk redpanda config set redpanda.kafka_api \
              '[{"name":"internal","address":"0.0.0.0","port":9092,"authentication_method":"none"},
                {"name":"external","address":"0.0.0.0","port":19092,"authentication_method":"none"},
                {"name":"secure","address":"0.0.0.0","port":19093,"authentication_method":"sasl"}]'
            rpk redpanda config set redpanda.advertised_kafka_api \
              '[{"name":"internal","address":"redpanda-0","port":9092},
                {"name":"external","address":"${ADVERTISED_HOST:-127.0.0.1}","port":19092},
                {"name":"secure","address":"${ADVERTISED_HOST:-127.0.0.1}","port":19093}]'
            rpk redpanda config set redpanda.kafka_api_tls \
              '[{"name":"secure","enabled":true,"cert_file":"/etc/redpanda/tls/broker.crt","key_file":"/etc/redpanda/tls/broker.key","require_client_auth":false}]'
        else
            echo "==> no tls/: plaintext only. For 19093 run ./make-tls.sh, then 'docker compose up -d --force-recreate'"
            rpk redpanda config set redpanda.kafka_api \
              '[{"name":"internal","address":"0.0.0.0","port":9092,"authentication_method":"none"},
                {"name":"external","address":"0.0.0.0","port":19092,"authentication_method":"none"}]'
            rpk redpanda config set redpanda.advertised_kafka_api \
              '[{"name":"internal","address":"redpanda-0","port":9092},
                {"name":"external","address":"${ADVERTISED_HOST:-127.0.0.1}","port":19092}]'
        fi

        exec rpk redpanda start \
          --mode=dev-container \
          --smp=1 \
          --default-log-level=info \
          --rpc-addr=redpanda-0:33145 \
          --advertise-rpc-addr=redpanda-0:33145

    ports:
      - "19092:19092"   # Kafka external, plaintext
      - "19093:19093"   # Kafka external, SASL_SSL (only with tls/)
      - "9644:9644"     # Admin API (optional, rpk/Console)

    volumes:
      - ./tls:/etc/redpanda/tls:ro
      - redpanda-data:/var/lib/redpanda/data

volumes:
  redpanda-data:
