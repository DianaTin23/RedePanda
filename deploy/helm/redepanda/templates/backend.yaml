{{- /*
Which CA the OTLP exporter has to be taught to trust, if any.

The bundled collector serves the release's own CA, which is already mounted for Kestrel. An
external collector may serve a private one too -- and until this variable existed there was no way
to say so: the whole trust-store apparatus below was gated on `otelCollector.enabled`, so
"the telemetry backend is a swappable backing service" held only for a collector whose certificate
a public CA had signed. That is not a swap, it is a swap with a condition nobody wrote down.

Empty means "nothing to add": either there is no collector at all, or its certificate already
validates against the public trust store the base image ships.
*/ -}}
{{- $otelEnabled := or .Values.otelCollector.enabled (ne (toString .Values.otelCollector.external.endpoint) "") }}
{{- $otelCaPath := "" }}
{{- $otelCaVolume := "" }}
{{- if .Values.otelCollector.enabled }}
{{- $otelCaPath = printf "%s/ca.crt" (include "redepanda.tlsMountPath" .) }}
{{- $otelCaVolume = "tls" }}
{{- else if and .Values.otelCollector.external.endpoint .Values.otelCollector.external.caSecret }}
{{- $otelCaPath = "/etc/redepanda/otel-ca/ca.crt" }}
{{- $otelCaVolume = "otel-ca" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redepanda.fullname" . }}-backend
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  # Omitted while an HPA owns this field. Otherwise every `helm upgrade` would write the number from
  # values.yaml back, the autoscaler would correct it again immediately, and the pod count would
  # oscillate between the two.
  replicas: {{ .Values.backend.replicas }}
  {{- end }}

  # Never below the configured count during a deploy. Readiness here means "replayed the topic to
  # the end", so a new pod only joins the Service once it can serve a complete room — and with
  # maxUnavailable: 0 the old pod is not allowed to leave until that has happened.
  #
  # maxSurge as an absolute 1 rather than a percentage: it rolls one pod at a time whatever the
  # autoscaler has done to the replica count, which is the cautious choice when readiness depends on
  # a broker round trip.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # A pod counts as available only once it has been Ready for this long. Readiness is a one-way
  # latch after the replay, so this only guards against a single probe succeeding against a pod that
  # is about to lose the broker again. Cheap: 5s per pod on a rollout.
  minReadySeconds: 5

  selector:
    matchLabels:
      {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redepanda.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Roll the pods when the configuration changes; without this a helm upgrade that only
        # edits the ConfigMap leaves the old values running.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Same reasoning for the certificates: rotating them is a delete-and-upgrade, and without
        # this the pods would keep serving the old certificate while their peers already trust
        # only the new CA. Note that on the very first install this hashes a throwaway render --
        # `lookup` finds no Secret yet -- so the first upgrade afterwards rolls the pods once.
        checksum/tls: {{ include (print $.Template.BasePath "/tls.yaml") . | sha256sum }}
        # Which build this pod is running, for anyone holding a `kubectl describe` and no
        # access to the shell history of whoever deployed it.
        {{- include "redepanda.releaseAnnotations" . | nindent 8 }}
        # There are deliberately NO prometheus.io/scrape annotations here. The backend pushes
        # over OTLP and exposes no /metrics endpoint.
    spec:
      # Longer than the 25s shutdown timeout the application configures for itself, so the
      # consumer can leave its group and the producer can flush before SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      # Prefers one replica per node, and never refuses to schedule for it. A hard constraint
      # (DoNotSchedule, or requiredDuringScheduling anti-affinity) would leave the second replica
      # Pending forever on the one-node kind and Docker Desktop clusters this chart is aimed at — a
      # worse outcome than no spreading at all. Provably inert on one node, correct on more, and the
      # README says which of those the demo actually exercises.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "backend") | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        # Matches APP_UID in the .NET base image. Must be numeric: the kubelet rejects images
        # whose USER is a name when runAsNonRoot is set.
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
{{- if $otelCaPath }}
      initContainers:
        # Builds the trust store the OTLP exporter uses to verify the collector.
        #
        # This exists because OTEL_EXPORTER_OTLP_CERTIFICATE cannot be used -- see the note in
        # configmap.yaml. Trusting the CA at the OS level reaches the exporter anyway: .NET on
        # Linux validates through OpenSSL, which reads SSL_CERT_FILE, and that covers every TLS
        # client in the process rather than the OTLP one alone.
        #
        # It concatenates rather than replaces: SSL_CERT_FILE overrides the whole trust store, so
        # a file holding only the release CA would leave the backend distrusting every public CA.
        #
        # The backend's own image, for the same reason the topic Job uses it: one image per
        # release, and no second base image to keep pinned and patched for a `cat`.
        - name: ca-bundle
          image: {{ include "redepanda.image" (dict "ctx" . "component" "backend") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - cat /etc/ssl/certs/ca-certificates.crt {{ $otelCaPath }}
              > /etc/redepanda/ca-bundle/ca-bundle.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            {{- if eq $otelCaVolume "tls" }}
            - name: tls
              mountPath: {{ include "redepanda.tlsMountPath" . }}
              readOnly: true
            {{- else }}
            # The CA of a collector this release does not deploy, from the Secret named in
            # otelCollector.external.caSecret.
            - name: otel-ca
              mountPath: /etc/redepanda/otel-ca
              readOnly: true
            {{- end }}
            - name: ca-bundle
              mountPath: /etc/redepanda/ca-bundle
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
{{- end }}
      containers:
        - name: backend
          image: {{ include "redepanda.image" (dict "ctx" . "component" "backend") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: {{ include "redepanda.fullname" . }}-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- /* Credentials from a Secret, never from the ConfigMap above. No-op without SASL. */}}
            {{- include "redepanda.saslEnv" (dict "ctx" .) | nindent 12 }}
{{- if $otelEnabled }}
            # Expanded by the kubelet from POD_NAME above. This is what makes the Prometheus
            # "instance" label the pod name; the application never sets the resource in code.
            #
            # Gated on telemetry being on at all rather than on the bundled collector: exporting to
            # an external one is still exporting, and without this the SDK invents an instance id
            # that changes on every restart -- the exact failure this variable exists to prevent.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(POD_NAME)"
{{- end }}
{{- if $otelCaPath }}
            # Read by OpenSSL, which is what .NET validates certificates with on Linux. Points at
            # the bundle the ca-bundle init container assembled, so the exporter trusts the
            # collector's CA -- this release's own, or the one named in
            # otelCollector.external.caSecret -- without the application configuring anything.
            - name: SSL_CERT_FILE
              value: /etc/redepanda/ca-bundle/ca-bundle.crt
{{- end }}
            {{- /*
            Anything else the operator needs, without editing a template. Last in the list on
            purpose: Kubernetes lets a later entry win, so this can override any value above it,
            including one from the ConfigMap -- which is what makes it useful for a one-off
            diagnosis (LOG_LEVEL=Debug on one release) rather than only for additions.

            Until this existed there was no env passthrough anywhere in the chart, and every new
            variable meant a template change. For a chart whose subject is configuration in the
            environment, that was the wrong shape.
            */}}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: https
              # The kubelet speaks TLS here but deliberately does not verify the certificate --
              # it has no way to be given this release's CA. That is the documented behaviour of
              # scheme: HTTPS, and it is fine: a probe asks "is this process alive", not "is this
              # process who it claims to be".
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # Reports 503 until broker metadata can be fetched, so the pod leaves the Service
            # endpoints while Redpanda is unreachable. The result is cached for 5s.
            httpGet:
              path: /health/ready
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Endpoint removal and SIGTERM are dispatched in parallel, and kube-proxy needs a moment
            # to stop steering new connections here. Sleeping first means no browser is handed to a
            # pod that is already on its way out.
            #
            # exec, and deliberately not the newer lifecycle.preStop.sleep: that field is only
            # honoured from Kubernetes 1.30 and is silently pruned below it, so an older cluster
            # would get no drain at all and say nothing about it. This is an execve of GNU
            # coreutils' sleep, not a shell — the Debian-based aspnet base image is fixed by
            # librdkafka anyway, and readOnlyRootFilesystem blocks writes, not execs.
            #
            # Budget against terminationGracePeriodSeconds: 45 — the grace period covers the hook as
            # well as the signal, so 5s here plus the host's own 25s shutdown timeout is 30s.
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Kestrel's server certificate and, in the same directory, the release CA that the
            # OTLP exporter verifies the collector against.
            - name: tls
              mountPath: {{ include "redepanda.tlsMountPath" . }}
              readOnly: true
            {{- if $otelCaPath }}
            - name: ca-bundle
              mountPath: /etc/redepanda/ca-bundle
              readOnly: true
            {{- end }}
            {{- if .Values.redpanda.auth.caSecret }}
            - name: broker-ca
              mountPath: /etc/redepanda/ca
              readOnly: true
            {{- end }}
            # The same writable temp directory the topic Job already mounts, for the same reason:
            # .NET wants somewhere to write under readOnlyRootFilesystem. The two pods run the same
            # runtime under the same flag, so exactly one of them having it was a bug either way --
            # and the one without it was the long-running process.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "redepanda.fullname" . }}-backend-tls
        - name: tmp
          emptyDir: {}
        {{- if $otelCaPath }}
        # Written once by the init container, read-only everywhere else. The pod's fsGroup makes
        # it writable by the non-root user; readOnlyRootFilesystem does not apply to a mount.
        - name: ca-bundle
          emptyDir: {}
        {{- end }}
        {{- if eq $otelCaVolume "otel-ca" }}
        # The CA of an external collector. Only mounted into the init container, which folds it
        # into the bundle above; the backend itself reads the bundle, never this.
        - name: otel-ca
          secret:
            secretName: {{ .Values.otelCollector.external.caSecret | quote }}
        {{- end }}
        {{- if .Values.redpanda.auth.caSecret }}
        - name: broker-ca
          secret:
            secretName: {{ .Values.redpanda.auth.caSecret | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redepanda.fullname" . }}-backend
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # No sessionAffinity, on purpose. It would be the reflex for an SSE service and it is exactly
  # wrong here: the SSE event id is the Kafka offset, which every replica agrees on, so a browser
  # reconnecting onto a different pod resumes correctly by itself. Pinning clients to pods would
  # only make a rollout worse.
  type: ClusterIP
  selector:
    {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "redepanda.fullname" . }}-backend
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # maxUnavailable, not minAvailable. They are the same thing at exactly two replicas and behave
  # very differently either side of it:
  #   * at replicas: 1, minAvailable: 1 permits zero disruptions and `kubectl drain` hangs forever —
  #     and on a single-node cluster that is the only kind of drain there is.
  #   * once the HPA has scaled out, minAvailable: 1 would allow every pod but one to be evicted at
  #     once. maxUnavailable: 1 keeps n-1 serving, whatever n turns out to be.
  #
  # Rendered unconditionally for the same reason: at one replica it is a harmless no-op, and gating
  # it would mean a `kubectl scale` or `--set backend.replicas=3` silently lost the guarantee.
  maxUnavailable: 1

  # Readiness here depends on the broker. If Redpanda is down, every backend pod is NotReady, the
  # budget is exhausted, and the default policy would refuse to evict pods that are useless anyway —
  # wedging a node drain on an unrelated outage.
  unhealthyPodEvictionPolicy: AlwaysAllow

  selector:
    matchLabels:
      {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
