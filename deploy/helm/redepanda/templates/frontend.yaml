apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redepanda.fullname" . }}-frontend
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  # Two, for the same reason the backend runs two -- and with more force. Every SSE stream in the
  # system is proxied through this deployment, so a single Caddy pod would make the backend's
  # redundancy unobservable: one evicted node, and every browser loses its connection regardless of
  # how many backend replicas were ready. Caddy holds no state, so the second replica costs 10m CPU.
  replicas: {{ .Values.frontend.replicas }}

  # Same shape as the backend's: never below the configured count during a deploy, one pod at a
  # time. Readiness here is cheap and local (Caddy answering its own /healthz), so this is about
  # not dropping streams mid-rollout rather than about waiting on a backing service.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5

  selector:
    matchLabels:
      {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redepanda.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        # Rotating the certificates is a delete-and-upgrade, and without this the pods would go
        # on serving the old one while their peers already trust only the new CA. See the same
        # annotation on the backend for the one wrinkle on a fresh install.
        checksum/tls: {{ include (print $.Template.BasePath "/tls.yaml") . | sha256sum }}
        {{- /* Which build this pod is running. */}}
        {{- include "redepanda.releaseAnnotations" . | nindent 8 }}
    spec:
      # Covers the preStop hook as well as the signal: 5s of drain plus Caddy's own graceful
      # shutdown of in-flight requests, with slack before SIGKILL. Shorter than the backend's 45s
      # because nothing here has to leave a consumer group or flush a producer.
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds }}

      # Prefers one replica per node without ever refusing to schedule -- same trade-off, and the
      # same one-node caveat, as the backend. See the comment there.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: {{ include "redepanda.image" (dict "ctx" . "component" "frontend") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: https
              containerPort: 8443
            # Serves nothing but a 308 to the port above. It is here so that an http:// address
            # someone still has answers with a redirect rather than a connection reset.
            - name: http-redirect
              containerPort: 8080
          env:
            # Caddy substitutes this into the Caddyfile before parsing it. The image carries
            # the in-cluster service name as its default, so this is belt and braces.
            - name: BACKEND_HOST
              value: "{{ include "redepanda.fullname" . }}-backend:8443"
            # Same mechanism: substituted into the Caddyfile before parsing. Governs the access
            # log and Caddy's own runtime log.
            - name: FRONTEND_LOG_LEVEL
              value: {{ .Values.frontend.logLevel | quote }}
            # The port the redirect names. It is the port the *client* can reach, which under
            # `kubectl port-forward` is the forwarded one and not this container's.
            - name: PUBLIC_HTTPS_PORT
              value: {{ .Values.tls.publicHttpsPort | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              # TLS without verification: the kubelet has no way to be handed this release's CA.
              # See the same note on the backend's probes.
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          lifecycle:
            # Endpoint removal and SIGTERM are dispatched in parallel, so without this a browser
            # can still be routed here after Caddy has begun shutting down -- and for an SSE
            # stream that is a dropped connection rather than one retried request. Same reasoning
            # and the same 5s as the backend; see backend.yaml for why this is an exec and not
            # lifecycle.preStop.sleep.
            #
            # /bin/sleep is busybox in the alpine base image this is built on.
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # The image runs setcap -r on the binary, so it never needs CAP_NET_BIND_SERVICE.
              drop: [ALL]
          volumeMounts:
            # This pod's own server certificate, and the release CA it verifies the backend
            # with when proxying /api. Both come from the same Secret, hence one mount.
            - name: tls
              mountPath: {{ include "redepanda.tlsMountPath" . }}
              readOnly: true
            # Caddy sweeps its certificate *storage* at startup — unrelated to the mount above,
            # which it only reads files from — and logs an error if these are not writable. Both
            # are throwaway: nothing here is persisted.
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "redepanda.fullname" . }}-frontend-tls
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redepanda.fullname" . }}-frontend
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: http-redirect
      port: 8080
      targetPort: http-redirect
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "redepanda.fullname" . }}-frontend
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  # maxUnavailable rather than minAvailable, and rendered unconditionally, for exactly the reasons
  # spelled out on the backend's budget.
  maxUnavailable: 1

  # Deliberately *without* the backend's unhealthyPodEvictionPolicy: AlwaysAllow. That field is
  # there because backend readiness depends on Redpanda, so a broker outage marks every replica
  # NotReady and would wedge an unrelated node drain. Caddy's /healthz depends on nothing outside
  # its own pod: a NotReady frontend is a genuinely broken frontend, and the default policy
  # refusing to evict the last one is then the correct answer rather than an obstacle.
  selector:
    matchLabels:
      {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
