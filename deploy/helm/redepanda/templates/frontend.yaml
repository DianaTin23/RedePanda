apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redepanda.fullname" . }}-frontend
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redepanda.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      {{- with include "redepanda.releaseAnnotations" . }}
      # Which build this pod is running. Guarded by `with` because, unlike the backend, this
      # pod template has no other annotation to keep the key from rendering empty.
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: {{ include "redepanda.image" (dict "ctx" . "component" "frontend") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Caddy substitutes this into the Caddyfile before parsing it. The image carries
            # the in-cluster service name as its default, so this is belt and braces.
            - name: BACKEND_HOST
              value: "{{ include "redepanda.fullname" . }}-backend:8080"
            # Same mechanism: substituted into the Caddyfile before parsing. Governs the access
            # log and Caddy's own runtime log.
            - name: FRONTEND_LOG_LEVEL
              value: {{ .Values.frontend.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # The image runs setcap -r on the binary, so it never needs CAP_NET_BIND_SERVICE.
              drop: [ALL]
          volumeMounts:
            # Even with auto_https off, Caddy sweeps its TLS storage at startup and logs an
            # error if these are not writable. Both are throwaway: nothing here is persisted.
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redepanda.fullname" . }}-frontend
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
