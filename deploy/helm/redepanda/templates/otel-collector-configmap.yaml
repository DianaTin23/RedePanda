{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redepanda.collectorService" . }}
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  # Kept as a real file under files/ so it can be checked with the collector binary itself:
  #   otelcol validate --config=deploy/helm/redepanda/files/otel-collector-config.yaml
  # It lives in its own template so the Deployment can hash it for a rollout trigger without
  # a template including itself.
  config.yaml: |
    {{- .Files.Get "files/otel-collector-config.yaml" | nindent 4 }}
{{- end }}
