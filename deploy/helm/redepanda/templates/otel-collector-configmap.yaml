{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redepanda.collectorService" . }}
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  config.yaml: |
    {{- .Files.Get "files/otel-collector-config.yaml" | nindent 4 }}
{{- end }}
