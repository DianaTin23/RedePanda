{{- if .Values.otelCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redepanda.collectorService" . }}
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "otel-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redepanda.labels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-configmap.yaml") . | sha256sum }}
        checksum/tls: {{ include (print $.Template.BasePath "/tls.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ .Values.otelCollector.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["--config=/conf/config.yaml"]
          env:
            - name: OTELCOL_LOG_LEVEL
              value: {{ .Values.otelCollector.logLevel | quote }}
            - name: OTELCOL_DEBUG_VERBOSITY
              value: {{ .Values.otelCollector.debugVerbosity | quote }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 8889
            - name: self-metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /
              port: health
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tls
              mountPath: {{ include "redepanda.tlsMountPath" . }}
              readOnly: true
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "redepanda.collectorService" . }}
        - name: tls
          secret:
            secretName: {{ include "redepanda.collectorService" . }}-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redepanda.collectorService" . }}
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  selector:
    {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "otel-collector") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prometheus
      port: 8889
      targetPort: prometheus
    - name: self-metrics
      port: 8888
      targetPort: self-metrics
{{- end }}
