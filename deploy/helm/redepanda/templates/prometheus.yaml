{{- if .Values.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redepanda.fullname" . }}-prometheus
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redepanda.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-configmap.yaml") . | sha256sum }}
        # Rotating the certificates must roll this pod: it both presents one and verifies the
        # collector with the CA. See the same annotation on the backend.
        checksum/tls: {{ include (print $.Template.BasePath "/tls.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        # The image declares `USER nobody`, which is NOT numeric. With runAsNonRoot set and no
        # runAsUser, the kubelet refuses to start the container:
        #   "container has runAsNonRoot and image has non-numeric user (nobody)".
        # 65534 is nobody.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Setting args replaces the image's CMD entirely, and that CMD is exactly these two
          # flags. Omitting --config.file would make Prometheus look for ./prometheus.yml
          # relative to its WORKDIR (/prometheus) and exit with a config load error.
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            # TLS for the UI and the API. It is a separate flag and a separate file on purpose:
            # prometheus.yml describes what Prometheus scrapes, this describes how it is reached.
            - --web.config.file=/etc/prometheus/web.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - name: https
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: https
              # TLS without verification, as on every other probe in this chart.
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: tsdb
              # Required by readOnlyRootFilesystem: the TSDB is written here. It is an emptyDir
              # on purpose -- the demo needs no metric history across restarts.
              mountPath: /prometheus
            # Both halves of Prometheus' TLS: the certificate it presents on 9090, and the CA it
            # verifies the collector with when scraping 8889.
            - name: tls
              mountPath: {{ include "redepanda.tlsMountPath" . }}
              readOnly: true
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "redepanda.fullname" . }}-prometheus
        - name: tsdb
          emptyDir: {}
        - name: tls
          secret:
            secretName: {{ include "redepanda.fullname" . }}-prometheus-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redepanda.fullname" . }}-prometheus
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    {{- include "redepanda.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
  ports:
    - name: https
      port: 9090
      targetPort: https
{{- end }}
