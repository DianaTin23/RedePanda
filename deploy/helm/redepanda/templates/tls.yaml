{{- $fullname := include "redepanda.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $caName := printf "%s-ca" $fullname }}

{{- $existingCa := lookup "v1" "Secret" $ns $caName }}
{{- $caIsNew := not $existingCa }}
{{- $ca := dict }}
{{- if $caIsNew }}
{{- $ca = genCA $caName (int .Values.tls.caValidityDays) }}
{{- else }}
{{- $ca = buildCustomCert (index $existingCa.data "ca.crt" | toString) (index $existingCa.data "ca.key" | toString) }}
{{- end }}

{{- $components := list
      (dict "name" "frontend" "service" (printf "%s-frontend" $fullname))
      (dict "name" "backend" "service" (printf "%s-backend" $fullname)) }}
{{- if .Values.otelCollector.enabled }}
{{- $components = append $components (dict "name" "otel-collector" "service" (include "redepanda.collectorService" .)) }}
{{- end }}
{{- if .Values.prometheus.enabled }}
{{- $components = append $components (dict "name" "prometheus" "service" (printf "%s-prometheus" $fullname)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  labels:
    {{- include "redepanda.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
{{- range $c := $components }}
{{- $secretName := printf "%s-%s-tls" $fullname $c.name }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $reuse := and $existing (not $caIsNew) (index (default dict $existing.data) "tls.crt") }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if $reuse }}
{{- $crt = index (default dict $existing.data) "tls.crt" | toString }}
{{- $key = index (default dict $existing.data) "tls.key" | toString }}
{{- else }}
{{- $altNames := list $c.service (printf "%s.%s" $c.service $ns) (printf "%s.%s.svc" $c.service $ns) (printf "%s.%s.svc.cluster.local" $c.service $ns) "localhost" }}
{{- $cert := genSignedCert $c.service (list "127.0.0.1") $altNames (int $.Values.tls.certValidityDays) $ca }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "redepanda.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
