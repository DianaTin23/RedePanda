{{- if .Values.adminJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redetim.fullname" . }}-admin-{{ .Release.Revision }}
  labels:
    {{- include "redetim.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-job
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.adminJob.ttlSecondsAfterFinished }}

  activeDeadlineSeconds: {{ .Values.adminJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "redetim.labels" . | nindent 8 }}
        app.kubernetes.io/component: admin-job
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      securityContext:
        {{- include "redetim.podSecurityContext" (dict "uid" 1654 "gid" 1654) | nindent 8 }}
      containers:
        - name: admin
          image: {{ include "redetim.image" (dict "ctx" . "component" "chatClient") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: {{ toJson .Values.adminJob.args }}

          stdin: {{ .Values.adminJob.interactive }}
          tty: {{ .Values.adminJob.interactive }}
          envFrom:
            - configMapRef:
                name: {{ include "redetim.fullname" . }}-config
          env:
            {{- include "redetim.saslEnv" (dict "ctx" .) | nindent 12 }}
            - name: TOPIC_WAIT_SECONDS
              value: {{ .Values.adminJob.brokerWaitSeconds | quote }}
            {{- with .Values.adminJob.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "redetim.containerSecurityContext" dict | nindent 12 }}
          volumeMounts:
            {{- include "redetim.chatClientJobVolumeMounts" . | nindent 12 }}
          resources:
            {{- include "redetim.chatClientJobResources" . | nindent 12 }}
      volumes:
        {{- include "redetim.chatClientJobVolumes" . | nindent 8 }}
{{- end }}
