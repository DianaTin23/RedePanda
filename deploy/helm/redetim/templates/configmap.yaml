{{- if and (include "redetim.saslEnabled" .) (not .Values.redpanda.auth.existingSecret) -}}
{{- fail "redpanda.auth.securityProtocol uses SASL, so redpanda.auth.existingSecret must name a Secret with the keys username and password." -}}
{{- end -}}
{{- if and (include "redetim.saslEnabled" .) (not .Values.redpanda.auth.saslMechanism) -}}
{{- fail "redpanda.auth.securityProtocol uses SASL, so redpanda.auth.saslMechanism must be set (for example ScramSha512)." -}}
{{- end -}}
{{- if and .Values.redpanda.enabled (ne (include "redetim.securityProtocol" .) "Plaintext") -}}
{{- fail (printf "redpanda.auth.securityProtocol is %q, but redpanda.enabled=true deploys the bundled broker, which listens in plaintext only. Either leave the protocol at Plaintext, or set redpanda.enabled=false and point redpanda.external.bootstrapServers at a secured broker." .Values.redpanda.auth.securityProtocol) -}}
{{- end -}}
{{- if and .Values.redpanda.enabled .Values.redpanda.external.bootstrapServers -}}
{{- fail "redpanda.external.bootstrapServers is set, but redpanda.enabled is true, so it would be ignored and every client would talk to the bundled broker instead. Set redpanda.enabled=false to use the external broker." -}}
{{- end -}}
{{- if and .Values.redpanda.auth.caSecret (not (has (include "redetim.securityProtocol" .) (list "Ssl" "SaslSsl"))) -}}
{{- fail (printf "redpanda.auth.caSecret is set, but redpanda.auth.securityProtocol is %q, which does not use TLS. Set it to Ssl or SaslSsl, or remove the CA Secret." .Values.redpanda.auth.securityProtocol) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redetim.fullname" . }}-config
  labels:
    {{- include "redetim.labels" . | nindent 4 }}
data:
  REDPANDA_BOOTSTRAP_SERVERS: {{ include "redetim.bootstrapServers" . | quote }}
  REDPANDA_TOPIC: {{ .Values.chat.topic | quote }}
  MAX_MESSAGE_LENGTH: {{ .Values.chat.maxMessageLength | quote }}
  CHAT_HISTORY_SIZE: {{ .Values.chat.historySize | quote }}

  CHAT_MAX_ROOMS: {{ .Values.chat.maxRooms | quote }}
  PRODUCE_TIMEOUT_MS: {{ .Values.chat.produceTimeoutMs | quote }}

  CHAT_REPLAY_RECORDS: {{ .Values.chat.replayRecords | quote }}

  CHAT_PARTITIONS: {{ .Values.chat.partitions | quote }}
  CHAT_REPLICATION_FACTOR: {{ .Values.chat.replicationFactor | quote }}

  REDPANDA_PRESENCE_TOPIC: {{ .Values.presence.topic | quote }}
  PRESENCE_PARTITIONS: {{ .Values.presence.partitions | quote }}
  PRESENCE_REPLICATION_FACTOR: {{ .Values.presence.replicationFactor | quote }}
  PRESENCE_TTL_SECONDS: {{ .Values.presence.ttlSeconds | quote }}

  LOG_LEVEL: {{ .Values.backend.logLevel | quote }}

  ASPNETCORE_URLS: "https://+:8443"
  ASPNETCORE_Kestrel__Certificates__Default__Path: "{{ include "redetim.tlsMountPath" . }}/tls.crt"
  ASPNETCORE_Kestrel__Certificates__Default__KeyPath: "{{ include "redetim.tlsMountPath" . }}/tls.key"

  REDPANDA_SECURITY_PROTOCOL: {{ .Values.redpanda.auth.securityProtocol | quote }}
{{- with .Values.redpanda.auth.saslMechanism }}
  REDPANDA_SASL_MECHANISM: {{ . | quote }}
{{- end }}
{{- if .Values.redpanda.auth.caSecret }}
  REDPANDA_SSL_CA_LOCATION: "/etc/redetim/ca/ca.crt"
{{- end }}
