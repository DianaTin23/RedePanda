{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redetim.fullname" . }}-prometheus
  labels:
    {{- include "redetim.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  web.yml: |
    tls_server_config:
      cert_file: {{ include "redetim.tlsMountPath" . }}/tls.crt
      key_file: {{ include "redetim.tlsMountPath" . }}/tls.key

  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}

    scrape_configs:
      - job_name: redetim-otel
        honor_labels: true

        scheme: https
        tls_config:
          ca_file: {{ include "redetim.tlsMountPath" . }}/ca.crt
        static_configs:
          - targets: ['{{ include "redetim.collectorService" . }}:8889']

      - job_name: otel-collector
        static_configs:
          - targets: ['{{ include "redetim.collectorService" . }}:8888']
{{- end }}
