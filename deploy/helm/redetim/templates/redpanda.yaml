{{- if .Values.redpanda.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.redpanda.serviceName }}
  labels:
    {{- include "redetim.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  serviceName: {{ .Values.redpanda.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "redetim.selectorLabels" (dict "ctx" . "component" "broker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redetim.labels" . | nindent 8 }}
        app.kubernetes.io/component: broker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "redetim.podSecurityContext" (dict "uid" 101 "gid" 101 "fsGroup" 101 "fsGroupChangePolicy" "OnRootMismatch") | nindent 8 }}
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}

          command: [rpk, redpanda, start]
          args:
            - --mode=dev-container
            - --smp={{ .Values.redpanda.smp }}
            - --memory={{ .Values.redpanda.memory }}
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://{{ .Values.redpanda.serviceName }}:9092
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            {{- include "redetim.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            {{- toYaml .Values.redpanda.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redpanda.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redpanda.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redpanda.serviceName }}
  labels:
    {{- include "redetim.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  type: ClusterIP
  selector:
    {{- include "redetim.selectorLabels" (dict "ctx" . "component" "broker") | nindent 4 }}
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: admin
      port: 9644
      targetPort: admin
{{- end -}}
