apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redetim.fullname" . }}-create-topic-{{ .Release.Revision }}
  labels:
    {{- include "redetim.labels" . | nindent 4 }}
    app.kubernetes.io/component: topic-job
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "redetim.labels" . | nindent 8 }}
        app.kubernetes.io/component: topic-job
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      securityContext:
        {{- include "redetim.podSecurityContext" (dict "uid" 1654 "gid" 1654) | nindent 8 }}
      containers:
        - name: create-topic
          image: {{ include "redetim.image" (dict "ctx" . "component" "chatClient") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["--ensure-topic"]
          envFrom:
            - configMapRef:
                name: {{ include "redetim.fullname" . }}-config
          env:
            {{- include "redetim.saslEnv" (dict "ctx" .) | nindent 12 }}
            - name: TOPIC_WAIT_SECONDS
              value: {{ .Values.topicJob.brokerWaitSeconds | quote }}
          securityContext:
            {{- include "redetim.containerSecurityContext" dict | nindent 12 }}
          volumeMounts:
            {{- include "redetim.chatClientJobVolumeMounts" . | nindent 12 }}
          resources:
            {{- include "redetim.chatClientJobResources" . | nindent 12 }}
      volumes:
        {{- include "redetim.chatClientJobVolumes" . | nindent 8 }}
