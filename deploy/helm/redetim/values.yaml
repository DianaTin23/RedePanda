# Default values for the redetim chart.

# Filled by deploy/releases/<version>.yaml. Without a release file the chart aborts.
release:
  version: ""
  gitSha: ""
  builtAt: ""
  dirty: false

# Not Never: Never fails on Docker Desktop with ErrImageNeverPull.
imagePullPolicy: IfNotPresent

# Only needed while the GHCR packages are private:
#   kubectl create secret docker-registry ghcr -n redetim --docker-server=ghcr.io \
#     --docker-username=<user> --docker-password=<PAT with read:packages>
#   helm upgrade ... --set imagePullSecrets[0].name=ghcr
imagePullSecrets: []

ingress:
  # false: no Ingress objects and no controller -- only `kubectl port-forward` is left.
  enabled: true
  # In the Ingress cert and the host rule. The port is not matched, so 8443 and 8080 both work.
  host: localhost
  # Must match traefik.ingressClass.name below.
  className: traefik

# The chart issues its own CA on first install. No off switch.
tls:
  caValidityDays: 3650
  # 825 days: the longest leaf lifetime Safari and Chrome accept.
  certValidityDays: 825
  # The port the *browser* reaches; only used for the redirect from :8080.
  publicHttpsPort: 8443

chat:
  topic: redetim-chat
  partitions: 1
  replicationFactor: 1
  # Coupled to ChatMessage.DefaultMaxTextLength.
  maxMessageLength: 500
  # librdkafka message.timeout.ms; its 300000 default holds a POST open for five minutes.
  produceTimeoutMs: 10000
  # Messages per room in the history buffer. 0 = everything in the topic.
  historySize: 200
  # Rooms held at once per replica. 0 = unbounded.
  maxRooms: 200
  # How far a starting pod reads back, **per partition**. 0 = the whole topic.
  replayRecords: 2000

# Log-compacted: current state only (key = room+nickname), not the history.
presence:
  topic: redetim-presence
  partitions: 1
  replicationFactor: 1
  # Seconds without renewal before a reservation is free. Well above the 15s heartbeat.
  ttlSeconds: 45

backend:
  # Tag comes from the release file; scripts/build-images.sh reads the name here.
  image:
    repository: ghcr.io/dianatin23/redetim-backend
    tag: ""

  # env: format. Applied after the ConfigMap and overrides it.
  extraEnv: []

  replicas: 2
  # .NET spelling (Trace|Debug|Information|Warning|Error|Critical|None).
  logLevel: Information

  # 5s preStop + 25s app shutdown, with slack before SIGKILL.
  terminationGracePeriodSeconds: 45

  # The CPU request is also the denominator of the HPA target. No CPU limit on purpose.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

  autoscaling:
    enabled: false
    # Never below the baseline the PDB and rollout strategy assume.
    minReplicas: 2
    maxReplicas: 4
    # Percent of the CPU *request*, not of the limit and not of the node.
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 60

frontend:
  image:
    repository: ghcr.io/dianatin23/redetim-frontend
    tag: ""
  replicas: 2
  terminationGracePeriodSeconds: 30
  # Caddy spelling (DEBUG|INFO|WARN|ERROR), not .NET's.
  logLevel: INFO
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Own image, same build and same tag as backend and frontend.
chatClient:
  image:
    repository: ghcr.io/dianatin23/redetim-chatclient
    tag: ""

topicJob:
  # Seconds --ensure-topic waits for broker metadata.
  brokerWaitSeconds: 180

redpanda:
  # false: no broker is deployed; the app points at external.bootstrapServers.
  enabled: true

  external:
    # Required once enabled: false -- otherwise the chart aborts at render time.
    bootstrapServers: ""

  auth:
    # Plaintext, Ssl, SaslPlaintext or SaslSsl. SASL_SSL is accepted as well.
    securityProtocol: Plaintext
    # Required with a SASL protocol: Plain, ScramSha256, ScramSha512 (SCRAM-SHA-512 too).
    saslMechanism: ""
    # Name of an *existing* secret with keys username and password. Never a value here.
    existingSecret: ""
    # Optional, TLS only: secret with key ca.crt for a private CA.
    caSecret: ""

  # docker.io, not docker.redpanda.com: the latter throttles anonymous manifest reads too hard.
  # KEEP IN SYNC with RedeTim-kafka-docker/docker-compose.yml (scripts/check-digests.sh).
  image: docker.io/redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d

  serviceName: redpanda
  storage: 1Gi
  storageClassName: ""

  # Otherwise Seastar sizes itself against the whole node.
  smp: 1
  memory: 1G
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 2Gi }

# Traefik subchart values. Only what is needed -- the rest stays at its defaults.
traefik:
  service:
    spec:
      # LoadBalancer, the subchart default, would stay <pending> forever in kind; hostPort is the way out.
      type: ClusterIP

  ingressClass:
    enabled: true
    # Pinned: unnamed, the class follows the *subchart* release name and ingress.className must track it.
    name: traefik
    isDefaultClass: true

  ports:
    web:
      # In the node container; kind-config.yaml forwards the same number. Above 1024 for rootless podman.
      hostPort: 8080
      exposedPort: 8080
      http:
        redirections:
          entryPoint:
            # Redirects to the target's *exposedPort*, so websecure exposes 8443 below.
            # 301 on GET, 308 otherwise -- that keeps method and body.
            to: websecure
            scheme: https
            permanent: true
    websecure:
      hostPort: 8443
      exposedPort: 8443
      transport:
        respondingTimeouts:
          # The 60s default is a deadline on the whole *connection*; /api/stream stays open for
          # hours. 0 = none; the price is that a wedged client holds its connection until TCP
          # notices, instead of being cut after a minute.
          readTimeout: "0s"

  # The dashboard would be a second way in that nobody demos and nobody secures.
  ingressRoute:
    dashboard:
      enabled: false
