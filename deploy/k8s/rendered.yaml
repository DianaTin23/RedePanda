# Source: redepanda/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redepanda-frontend
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g456ed88"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: frontend
spec:
  # Two, for the same reason the backend runs two -- and with more force. Every SSE stream in the
  # system is proxied through this deployment, so a single Caddy pod would make the backend's
  # redundancy unobservable: one evicted node, and every browser loses its connection regardless of
  # how many backend replicas were ready. Caddy holds no state, so the second replica costs 10m CPU.
  replicas: 2

  # Same shape as the backend's: never below the configured count during a deploy, one pod at a
  # time. Readiness here is cheap and local (Caddy answering its own /healthz), so this is about
  # not dropping streams mid-rollout rather than about waiting on a backing service.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: redepanda
      app.kubernetes.io/instance: redepanda
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        helm.sh/chart: redepanda-0.1.0
        app.kubernetes.io/name: redepanda
        app.kubernetes.io/instance: redepanda
        app.kubernetes.io/version: "0.1.0-g456ed88"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: frontend
      # Which build this pod is running. Guarded by `with` because, unlike the backend, this
      # pod template has no other annotation to keep the key from rendering empty.
      annotations:
        
        redepanda.dev/git-sha: "456ed884012b8f775768c9b17bd95ae166c9ff59"
        redepanda.dev/built-at: "2026-08-12T10:47:20Z"
    spec:
      # Covers the preStop hook as well as the signal: 5s of drain plus Caddy's own graceful
      # shutdown of in-flight requests, with slack before SIGKILL. Shorter than the backend's 45s
      # because nothing here has to leave a consumer group or flush a producer.
      terminationGracePeriodSeconds: 30

      # Prefers one replica per node without ever refusing to schedule -- same trade-off, and the
      # same one-node caveat, as the backend. See the comment there.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: redepanda
              app.kubernetes.io/instance: redepanda
              app.kubernetes.io/component: frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: "redepanda-frontend:0.1.0-g456ed88"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Caddy substitutes this into the Caddyfile before parsing it. The image carries
            # the in-cluster service name as its default, so this is belt and braces.
            - name: BACKEND_HOST
              value: "redepanda-backend:8080"
            # Same mechanism: substituted into the Caddyfile before parsing. Governs the access
            # log and Caddy's own runtime log.
            - name: FRONTEND_LOG_LEVEL
              value: "INFO"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          lifecycle:
            # Endpoint removal and SIGTERM are dispatched in parallel, so without this a browser
            # can still be routed here after Caddy has begun shutting down -- and for an SSE
            # stream that is a dropped connection rather than one retried request. Same reasoning
            # and the same 5s as the backend; see backend.yaml for why this is an exec and not
            # lifecycle.preStop.sleep.
            #
            # /bin/sleep is busybox in the alpine base image this is built on.
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # The image runs setcap -r on the binary, so it never needs CAP_NET_BIND_SERVICE.
              drop: [ALL]
          volumeMounts:
            # Even with auto_https off, Caddy sweeps its TLS storage at startup and logs an
            # error if these are not writable. Both are throwaway: nothing here is persisted.
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
