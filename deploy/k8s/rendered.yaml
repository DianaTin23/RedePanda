apiVersion: v1
kind: ConfigMap
metadata:
  name: redepanda-otel-collector
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g456ed88"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: otel-collector
data:
  # Kept as a real file under files/ so it can be checked with the collector binary itself:
  #   otelcol validate --config=deploy/helm/redepanda/files/otel-collector-config.yaml
  # It lives in its own template so the Deployment can hash it for a rollout trigger without
  # a template including itself.
  config.yaml: |
    extensions:
      # Without this block port 13133 is dead and the probes fail. It must ALSO be listed under
      # service.extensions below, or it is parsed and then never started.
      health_check:
        endpoint: 0.0.0.0:13133
        path: /
    
    receivers:
      otlp:
        protocols:
          grpc:
            # Not localhost: nothing from another pod would ever arrive.
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      # Must be the first processor so backpressure reaches the receiver.
      memory_limiter:
        check_interval: 1s
        limit_mib: 160
        spike_limit_mib: 40
      batch:
        send_batch_size: 1024
        timeout: 10s
    
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        # Stated explicitly rather than relying on the default behaviour. This is what turns
        # redepanda.messages.sent into redepanda_messages_sent_total.
        translation_strategy: UnderscoreEscapingWithSuffixes
        send_timestamps: true
        # Must exceed OTEL_METRIC_EXPORT_INTERVAL or series flicker between scrapes.
        metric_expiration: 5m
        without_scope_info: true
        resource_to_telemetry_conversion:
          enabled: false
      # Named "debug"; the old "logging" exporter was removed in v0.111.0.
      debug:
        verbosity: ${env:OTELCOL_DEBUG_VERBOSITY:-basic}
    
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]
      telemetry:
        logs:
          level: ${env:OTELCOL_LOG_LEVEL:-info}
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
    

