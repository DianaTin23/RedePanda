apiVersion: v1
kind: ConfigMap
metadata:
  name: redepanda-config
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g456ed88"
    app.kubernetes.io/managed-by: Helm
data:
  # Application configuration. Plain names rather than ASP.NET's Section__Key convention,
  # because the backend reads these explicitly; see BackendOptions.
  REDPANDA_BOOTSTRAP_SERVERS: "redpanda:9092"
  REDPANDA_TOPIC: "redepanda-chat"
  MAX_MESSAGE_LENGTH: "500"
  CHAT_HISTORY_SIZE: "200"
  PRODUCE_TIMEOUT_MS: "10000"

  # Read by the topic Job, which runs the chat client's --ensure-topic mode. They live here rather
  # than as env: entries on the Job so that it needs nothing but an envFrom -- one configuration
  # source for the application and for the admin process that prepares it.
  CHAT_PARTITIONS: "1"
  CHAT_REPLICATION_FACTOR: "1"
  LOG_LEVEL: "Information"
  ASPNETCORE_URLS: "http://+:8080"

  # How the clients reach the broker. Everything except the credentials belongs here: a protocol
  # and a mechanism are configuration, a username and a password are not, and mixing them would
  # put secrets into an object designed to be read freely. They come from a Secret instead; see
  # the env: block on the backend Deployment.
  REDPANDA_SECURITY_PROTOCOL: "Plaintext"

  # OTEL_* are specified by OpenTelemetry and read by the SDK itself. They are deliberately not
  # re-read in application code, which would create a second source of truth.
  #
  # service.namespace is deliberately NOT set: the collector's Prometheus exporter builds the
  # job label as <service.namespace>/<service.name>, so setting it would turn every job label
  # into "redepanda/redepanda-backend" and break the PromQL examples in the README.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://redepanda-otel-collector:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_SERVICE_NAME: "redepanda-backend"
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  OTEL_SDK_DISABLED: "false"

