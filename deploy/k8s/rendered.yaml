apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redepanda-backend
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g456ed88"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backend
spec:
  # maxUnavailable, not minAvailable. They are the same thing at exactly two replicas and behave
  # very differently either side of it:
  #   * at replicas: 1, minAvailable: 1 permits zero disruptions and `kubectl drain` hangs forever —
  #     and on a single-node cluster that is the only kind of drain there is.
  #   * once the HPA has scaled out, minAvailable: 1 would allow every pod but one to be evicted at
  #     once. maxUnavailable: 1 keeps n-1 serving, whatever n turns out to be.
  #
  # Rendered unconditionally for the same reason: at one replica it is a harmless no-op, and gating
  # it would mean a `kubectl scale` or `--set backend.replicas=3` silently lost the guarantee.
  maxUnavailable: 1

  # Readiness here depends on the broker. If Redpanda is down, every backend pod is NotReady, the
  # budget is exhausted, and the default policy would refuse to evict pods that are useless anyway —
  # wedging a node drain on an unrelated outage.
  unhealthyPodEvictionPolicy: AlwaysAllow

  selector:
    matchLabels:
      app.kubernetes.io/name: redepanda
      app.kubernetes.io/instance: redepanda
      app.kubernetes.io/component: backend

