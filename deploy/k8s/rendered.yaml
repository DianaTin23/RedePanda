          # Setting args replaces the image's CMD entirely, and that CMD is exactly these two
          # flags. Omitting --config.file would make Prometheus look for ./prometheus.yml
          # relative to its WORKDIR (/prometheus) and exit with a config load error.
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
          ports:
            - name: http
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: tsdb
              # Required by readOnlyRootFilesystem: the TSDB is written here. It is an emptyDir
              # on purpose -- the demo needs no metric history across restarts.
              mountPath: /prometheus
          resources:
            limits:
              memory: 512Mi
            requests:
