apiVersion: apps/v1
kind: Deployment
metadata:
  name: redepanda-prometheus
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g456ed88"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redepanda
      app.kubernetes.io/instance: redepanda
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        helm.sh/chart: redepanda-0.1.0
        app.kubernetes.io/name: redepanda
        app.kubernetes.io/instance: redepanda
        app.kubernetes.io/version: "0.1.0-g456ed88"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/config: e0e24df3f7344e34c38cff08d0256c1afccc685cb063193f71f11014293170b3
    spec:
      securityContext:
        runAsNonRoot: true
        # The image declares `USER nobody`, which is NOT numeric. With runAsNonRoot set and no
        # runAsUser, the kubelet refuses to start the container:
        #   "container has runAsNonRoot and image has non-numeric user (nobody)".
        # 65534 is nobody.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: "quay.io/prometheus/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69"
          imagePullPolicy: IfNotPresent
          # Setting args replaces the image's CMD entirely, and that CMD is exactly these two
          # flags. Omitting --config.file would make Prometheus look for ./prometheus.yml
          # relative to its WORKDIR (/prometheus) and exit with a config load error.
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
          ports:
            - name: http
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: tsdb
              # Required by readOnlyRootFilesystem: the TSDB is written here. It is an emptyDir
              # on purpose -- the demo needs no metric history across restarts.
              mountPath: /prometheus
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: redepanda-prometheus
        - name: tsdb
          emptyDir: {}
