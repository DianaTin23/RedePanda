apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g103b98b-dirty.5f4f110"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: broker
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redepanda
      app.kubernetes.io/instance: redepanda
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        helm.sh/chart: redepanda-0.1.0
        app.kubernetes.io/name: redepanda
        app.kubernetes.io/instance: redepanda
        app.kubernetes.io/version: "0.1.0-g103b98b-dirty.5f4f110"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: broker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # The image creates its user with --uid 101 --gid 101.
        runAsUser: 101
        runAsGroup: 101
        # Without fsGroup a freshly provisioned PVC is mounted root-owned and the broker cannot
        # write its data directory. It only bites on a *fresh* volume, so it survives every
        # upgrade test and then fails on the first clean install.
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redpanda
          image: "docker.io/redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d"
          imagePullPolicy: IfNotPresent

          # `command` replaces the image ENTRYPOINT (/entrypoint.sh), and that script is the
          # only thing that maps the name `redpanda` onto rpk. /usr/bin/redpanda is the Seastar
          # broker binary: it does not understand `start` or `--mode` and exits immediately with
          # a parse error. Invoking rpk explicitly is what the official chart does too.
          command: [rpk, redpanda, start]
          args:
            # dev-container already implies --overprovisioned, --reserve-memory 0M and
            # --check=false, but NOT --smp, which is why that one is still listed.
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            # Deliberately NOT read-only, unlike every other pod in this chart: `rpk redpanda
            # start` writes the merged broker configuration to /etc/redpanda/redpanda.yaml on
            # every start. This is recorded as a known limitation in the README.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 1Gi
  volumeClaimTemplates:
    # A volumeClaimTemplate rather than a standalone PVC, so the volume is bound to the
    # StatefulSet's identity. Note that these PVCs deliberately outlive `helm uninstall`.
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# Source: redepanda/templates/topic-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: redepanda-create-topic
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g103b98b-dirty.5f4f110"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: topic-job
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # before-hook-creation is what makes a rerun possible at all: a Job's pod template is
    # immutable, so without deleting the previous Job first, every upgrade would fail with
    # "field is immutable". hook-failed is included so a failed run does not linger -- hook
    # resources are not part of the release and `helm uninstall` will not clean them up.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 10
  # Belt and braces alongside the delete policy, for the case where the hook is run outside a
  # normal release lifecycle.
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        helm.sh/chart: redepanda-0.1.0
        app.kubernetes.io/name: redepanda
        app.kubernetes.io/instance: redepanda
        app.kubernetes.io/version: "0.1.0-g103b98b-dirty.5f4f110"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: topic-job
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topic
          image: "docker.io/redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d"
          imagePullPolicy: IfNotPresent
          env:
            - name: REDPANDA_TOPIC
              value: "redepanda-chat"
            # rpk writes its scratch config under $HOME; point that at the writable emptyDir.
            - name: HOME
              value: /tmp
          command: [/bin/sh, -ec]
          args:
            - |
              # `rpk cluster health` speaks the Admin API on 9644 -- it has no --brokers flag,
              # and pointing it at 9092 makes it fail with "unknown flag". Waiting on the exit
              # code rather than grepping the output keeps this robust across rpk versions.
              healthy=0
              for i in $(seq 1 60); do
                if rpk cluster health -X admin.hosts=redpanda:9644 --exit-when-healthy >/dev/null 2>&1; then
                  healthy=1
                  break
                fi
                echo "waiting for the broker to become healthy ($i/60)"
                sleep 3
              done

              if [ "$healthy" != "1" ]; then
                echo "broker did not become healthy within 180s" >&2
                exit 1
              fi

              # `rpk topic create` exits 1 when the topic already exists, so a plain call would
              # fail the hook on every single helm upgrade. Verified against Redpanda v26.2.1.
              if rpk topic create "$REDPANDA_TOPIC" \
                   -p 1 \
                   -r 1 \
                   -X brokers=redpanda:9092; then
                echo "created topic $REDPANDA_TOPIC"
              else
                # Confirm it exists rather than swallowing every possible failure.
                rpk topic describe "$REDPANDA_TOPIC" -X brokers=redpanda:9092 >/dev/null
                echo "topic $REDPANDA_TOPIC already exists"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: tmp
          emptyDir: {}

