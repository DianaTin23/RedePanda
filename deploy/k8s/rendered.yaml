  template:
    metadata:
      labels:
        helm.sh/chart: redepanda-0.1.0
        app.kubernetes.io/name: redepanda
        app.kubernetes.io/instance: redepanda
        app.kubernetes.io/version: "0.1.0-g103b98b-dirty.5f4f110"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/config: e31cc1c74f04d569641faa78076a2a8b8d8e29ef032a42b9318346d0cba39632
    spec:
      securityContext:
        runAsNonRoot: true
        # The image declares `USER nobody`, which is NOT numeric. With runAsNonRoot set and no
        # runAsUser, the kubelet refuses to start the container:
        #   "container has runAsNonRoot and image has non-numeric user (nobody)".
        # 65534 is nobody.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: "quay.io/prometheus/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69"
