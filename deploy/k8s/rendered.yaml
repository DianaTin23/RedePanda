# Source: redepanda/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redepanda-backend
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g456ed88"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backend
spec:
  # Omitted while an HPA owns this field. Otherwise every `helm upgrade` would write the number from
  # values.yaml back, the autoscaler would correct it again immediately, and the pod count would
  # oscillate between the two.
  replicas: 2

  # Never below the configured count during a deploy. Readiness here means "replayed the topic to
  # the end", so a new pod only joins the Service once it can serve a complete room — and with
  # maxUnavailable: 0 the old pod is not allowed to leave until that has happened.
  #
  # maxSurge as an absolute 1 rather than a percentage: it rolls one pod at a time whatever the
  # autoscaler has done to the replica count, which is the cautious choice when readiness depends on
  # a broker round trip.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # A pod counts as available only once it has been Ready for this long. Readiness is a one-way
  # latch after the replay, so this only guards against a single probe succeeding against a pod that
  # is about to lose the broker again. Cheap: 5s per pod on a rollout.
  minReadySeconds: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: redepanda
      app.kubernetes.io/instance: redepanda
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        helm.sh/chart: redepanda-0.1.0
        app.kubernetes.io/name: redepanda
        app.kubernetes.io/instance: redepanda
        app.kubernetes.io/version: "0.1.0-g456ed88"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: backend
      annotations:
        # Roll the pods when the configuration changes; without this a helm upgrade that only
        # edits the ConfigMap leaves the old values running.
        checksum/config: 760c9830f0af0cf5f8e5732d73b1fee49e2e3ac38ddd9c6803c01f9eeb823df6
        # Which build this pod is running, for anyone holding a `kubectl describe` and no
        # access to the shell history of whoever deployed it.
        
        redepanda.dev/git-sha: "456ed884012b8f775768c9b17bd95ae166c9ff59"
        redepanda.dev/built-at: "2026-08-12T10:47:20Z"
        # There are deliberately NO prometheus.io/scrape annotations here. The backend pushes
        # over OTLP and exposes no /metrics endpoint.
    spec:
      # Longer than the 25s shutdown timeout the application configures for itself, so the
      # consumer can leave its group and the producer can flush before SIGKILL.
      terminationGracePeriodSeconds: 45
      # Prefers one replica per node, and never refuses to schedule for it. A hard constraint
      # (DoNotSchedule, or requiredDuringScheduling anti-affinity) would leave the second replica
      # Pending forever on the one-node kind and Docker Desktop clusters this chart is aimed at — a
      # worse outcome than no spreading at all. Provably inert on one node, correct on more, and the
      # README says which of those the demo actually exercises.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: redepanda
              app.kubernetes.io/instance: redepanda
              app.kubernetes.io/component: backend
      securityContext:
        runAsNonRoot: true
        # Matches APP_UID in the .NET base image. Must be numeric: the kubelet rejects images
        # whose USER is a name when runAsNonRoot is set.
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "redepanda-backend:0.1.0-g456ed88"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: redepanda-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
            # Expanded by the kubelet from POD_NAME above. This is what makes the Prometheus
            # "instance" label the pod name; the application never sets the resource in code.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(POD_NAME)"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # Reports 503 until broker metadata can be fetched, so the pod leaves the Service
            # endpoints while Redpanda is unreachable. The result is cached for 5s.
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Endpoint removal and SIGTERM are dispatched in parallel, and kube-proxy needs a moment
            # to stop steering new connections here. Sleeping first means no browser is handed to a
            # pod that is already on its way out.
            #
            # exec, and deliberately not the newer lifecycle.preStop.sleep: that field is only
            # honoured from Kubernetes 1.30 and is silently pruned below it, so an older cluster
            # would get no drain at all and say nothing about it. This is an execve of GNU
            # coreutils' sleep, not a shell — the Debian-based aspnet base image is fixed by
            # librdkafka anyway, and readOnlyRootFilesystem blocks writes, not execs.
            #
            # Budget against terminationGracePeriodSeconds: 45 — the grace period covers the hook as
            # well as the signal, so 5s here plus the host's own 25s shutdown timeout is 30s.
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
