# Source: redepanda/templates/topic-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: redepanda-create-topic
  labels:
    helm.sh/chart: redepanda-0.1.0
    app.kubernetes.io/name: redepanda
    app.kubernetes.io/instance: redepanda
    app.kubernetes.io/version: "0.1.0-g456ed88"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: topic-job
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # before-hook-creation is what makes a rerun possible at all: a Job's pod template is
    # immutable, so without deleting the previous Job first, every upgrade would fail with
    # "field is immutable". hook-failed is included so a failed run does not linger -- hook
    # resources are not part of the release and `helm uninstall` will not clean them up.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 10
  # Belt and braces alongside the delete policy, for the case where the hook is run outside a
  # normal release lifecycle.
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        helm.sh/chart: redepanda-0.1.0
        app.kubernetes.io/name: redepanda
        app.kubernetes.io/instance: redepanda
        app.kubernetes.io/version: "0.1.0-g456ed88"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: topic-job
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # APP_UID from the .NET base image, numeric because runAsNonRoot rejects a named USER.
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topic
          # The application's own image, running its own --ensure-topic mode. It used to be
          # `rpk` in the Redpanda image driven by a thirty-line shell script: a second codebase
          # and a second configuration source for a task that belongs to this application.
          # 12-Factor XII asks for an admin process that ships and runs with the app, and this is
          # what that costs -- one image, already built by the same script as the other two.
          image: "redepanda-chatclient:0.1.0-g456ed88"
          imagePullPolicy: IfNotPresent
          args: ["--ensure-topic"]
          envFrom:
            # The same ConfigMap the backend reads, in full and unedited. Nothing about the broker
            # or the topic is restated here, so the two cannot drift apart.
            - configMapRef:
                name: redepanda-config
          env:
            
            # The Job runs as a post-install hook, so the broker may still be starting; and against
            # an external broker there may be nothing else to wait on at all. --ensure-topic polls
            # for metadata until this budget is spent. It is a *metadata* request rather than
            # `rpk cluster health`, which needs the Admin API on 9644 -- a port a managed broker
            # has no reason to expose.
            - name: TOPIC_WAIT_SECONDS
              value: "180"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        # The .NET runtime wants a writable temp directory; the root filesystem is read-only.
        - name: tmp
          emptyDir: {}

