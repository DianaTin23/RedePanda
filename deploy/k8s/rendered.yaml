    spec:
      securityContext:
        runAsNonRoot: true
        # The image is FROM scratch and already runs as 10001; stated explicitly so the
        # kubelet's runAsNonRoot check has a numeric uid to verify.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: "docker.io/otel/opentelemetry-collector:0.158.0@sha256:5b97e6e3550ec6e48a71dba6f6304d349a293af8df4ee1f51da67be94fce2ecd"
          imagePullPolicy: IfNotPresent
