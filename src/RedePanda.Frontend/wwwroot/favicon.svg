<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>RedePanda</title>
  <!-- Ears first, so the head overlaps their lower halves. -->
  <circle cx="7.2" cy="9.5" r="5.4" fill="#8E3A1E"/>
  <circle cx="24.8" cy="9.5" r="5.4" fill="#8E3A1E"/>
  <circle cx="7.2" cy="9.5" r="2.5" fill="#F2E3D6"/>
  <circle cx="24.8" cy="9.5" r="2.5" fill="#F2E3D6"/>
  <ellipse cx="16" cy="18.6" rx="11.6" ry="10.4" fill="#C4552F"/>
  <!-- Muzzle, then the eye patches over it: the two cream areas meet, as they do on the animal. -->
  <ellipse cx="16" cy="24.4" rx="5.6" ry="4.2" fill="#F2E3D6"/>
  <ellipse cx="10.6" cy="17" rx="4.5" ry="4.9" fill="#F2E3D6"/>
  <ellipse cx="21.4" cy="17" rx="4.5" ry="4.9" fill="#F2E3D6"/>
  <circle cx="11.3" cy="17.4" r="1.9" fill="#241512"/>
  <circle cx="20.7" cy="17.4" r="1.9" fill="#241512"/>
  <ellipse cx="16" cy="22.3" rx="2.3" ry="1.8" fill="#241512"/>
</svg>
